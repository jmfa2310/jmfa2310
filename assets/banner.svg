<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-label="João Antunes, Software Developer — OutSystems, React, Go and APIs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080E1E"/>
      <stop offset="0.5" stop-color="#101A32"/>
      <stop offset="1" stop-color="#080C17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5CE1E6"/>
      <stop offset="1" stop-color="#76A6FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CE1E6" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0.03"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#39506C" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="rounded"><rect width="1200" height="350" rx="20"/></clipPath>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <g clip-path="url(#rounded)">
    <rect width="1200" height="350" fill="url(#bg)"/>
    <rect width="1200" height="350" fill="url(#grid)"/>
    <circle cx="1045" cy="115" r="144" fill="#3CAECF" opacity="0.12" filter="url(#blur)"/>
    <circle cx="912" cy="298" r="120" fill="#F97316" opacity="0.11" filter="url(#blur)"/>
    <path d="M0 1H1200V349H0Z" fill="none" stroke="#253A58" stroke-width="2"/>
    <rect x="58" y="54" width="222" height="29" rx="14.5" fill="#162C41" stroke="#325C70"/>
    <circle cx="73" cy="68" r="4" fill="#5CE1E6"/>
    <text x="87" y="73" fill="#A8C7DC" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2.3" font-weight="700">SOFTWARE DEVELOPER</text>
    <text x="56" y="165" fill="#F3F7FE" font-size="66" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="-2">João Antunes</text>
    <rect x="60" y="191" width="78" height="4" rx="2" fill="url(#accent)"/>
    <text x="60" y="235" fill="#C2D3E8" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="0.3">OutSystems  <tspan fill="#F97316">•</tspan>  React  <tspan fill="#F97316">•</tspan>  Go  <tspan fill="#F97316">•</tspan>  API Integrations</text>
    <text x="60" y="293" fill="#738EA9" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.5">PORTUGAL     /     WEB + MOBILE     /     FULL-STACK MINDSET</text>
    <g transform="translate(868,58)">
      <rect width="285" height="230" rx="18" fill="#0B1728" stroke="#36506A" stroke-width="1.5"/>
      <path d="M0 50H285" stroke="#36506A"/>
      <circle cx="22" cy="25" r="6" fill="#F97316"/>
      <circle cx="42" cy="25" r="6" fill="#5CE1E6"/>
      <circle cx="62" cy="25" r="6" fill="#6E80AF"/>
      <text x="18" y="91" font-family="Consolas, monospace" fill="#7A95B5" font-size="15">const developer = {</text>
      <text x="38" y="120" font-family="Consolas, monospace" fill="#5CE1E6" font-size="15">name: <tspan fill="#F3F7FE">'João',</tspan></text>
      <text x="38" y="149" font-family="Consolas, monospace" fill="#5CE1E6" font-size="15">stack: <tspan fill="#F3F7FE">'full-stack',</tspan></text>
      <text x="38" y="178" font-family="Consolas, monospace" fill="#5CE1E6" font-size="15">focus: <tspan fill="#F3F7FE">'building'</tspan></text>
      <text x="18" y="205" font-family="Consolas, monospace" fill="#7A95B5" font-size="15">};</text>
    </g>
  </g>
</svg>
